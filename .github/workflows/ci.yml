name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the version publish.yml releases on. Without it here, a green CI
        # would say nothing about whether a release can even be built.
        node: ['22', '24']
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run check

  # package.json claims `engines: node >=20`. The suite above cannot test that
  # claim: it runs TypeScript through node's type stripping, which 20 does not
  # have. So build here and run the compiled output — the only thing a consumer
  # ever executes — on the oldest runtime we advertise.
  engines:
    runs-on: ubuntu-latest
    name: dist runs on the oldest node we claim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --version
      - run: node test/smoke.mjs
